<!-- @dsCard group="Brand" height=420 subtitle="The logo files themselves: colour as <img>, mono as a mask over currentColor" -->
<style>
  .mark--mono { display: block; background: currentColor; -webkit-mask: var(--file) center / contain no-repeat; mask: var(--file) center / contain no-repeat; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 32px; }
</style>
<div class="ad-root" style="padding:32px 24px;display:grid;gap:32px">
  <div class="row">
    <img src="../../../../public/brand/adli-seal.svg" alt="" width="36" height="36">
    <span class="mark--mono" style="--file:url(../../../../public/brand/adli-wordmark-mono.svg);width:85px;height:30px;color:var(--ink)"></span>
    <span class="mark--mono" style="--file:url(../../../../public/brand/adli-bottle-icon-mono.svg);width:15px;height:26px;color:var(--ink)"></span>
  </div>
  <div class="row" data-theme="night" style="background:var(--surface-sunk);padding:24px;border-radius:var(--radius-md)">
    <span class="mark--mono" style="--file:url(../../../../public/brand/adli-logo-mono.svg);width:136px;height:171px;color:var(--cream)"></span>
    <img src="../../../../public/brand/adli-seal.svg" alt="" width="64" height="64">
  </div>
</div>
