<!-- @dsCard group="Products" height=300 subtitle="Size chips and colour swatches; out-of-stock values struck through" -->
<div class="ad-root" style="padding:24px;max-width:440px">
  <div class="ad-picker">
    <fieldset class="ad-picker__option">
      <legend class="ad-picker__legend">اللون<span class="ad-picker__chosen">: أسود</span></legend>
      <div class="ad-picker__values">
        <label class="ad-swatch"><input type="radio" class="sr-only" name="pv-color" checked><span class="ad-swatch__dot" style="--swatch:#111111"></span><span class="ad-picker__label">أسود</span></label>
        <label class="ad-swatch"><input type="radio" class="sr-only" name="pv-color"><span class="ad-swatch__dot" style="--swatch:#1F2A44"></span><span class="ad-picker__label">كحلي</span></label>
      </div>
    </fieldset>
    <fieldset class="ad-picker__option">
      <legend class="ad-picker__legend">المقاس<span class="ad-picker__chosen">: M</span></legend>
      <div class="ad-picker__values">
        <label class="ad-chip"><input type="radio" class="sr-only" name="pv-size"><span class="ad-picker__label">S</span></label>
        <label class="ad-chip"><input type="radio" class="sr-only" name="pv-size" checked><span class="ad-picker__label">M</span></label>
        <label class="ad-chip is-out"><input type="radio" class="sr-only" name="pv-size" disabled><span class="ad-picker__label">L</span></label>
      </div>
    </fieldset>
  </div>
  <div class="ad-card__row" style="justify-content:flex-start;gap:24px">
    <span class="ad-price">₪ 45</span>
    <button class="ad-btn ad-btn--primary" type="button">أضف للطلب</button>
  </div>
  <p class="ad-stock">كمية محدودة</p>
</div>
