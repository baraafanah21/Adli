<style>
  .pv-btn { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding-inline:var(--space-3); border:0; border-radius:var(--radius-pill); background:none; color:var(--brass); font:inherit; font-size:15px; font-weight:500; }
  .pv-panel { margin-top:var(--space-2); width:min(640px,100%); padding:var(--space-3); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-panel); }
  .pv-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:var(--space-1); margin:0; padding:0; list-style:none; }
  .pv-grid a { display:grid; justify-items:center; gap:var(--space-2); min-height:96px; align-content:center; padding:var(--space-3) var(--space-2); border-radius:var(--radius-hair); color:var(--ink); font-size:14px; font-weight:500; text-align:center; text-decoration:none; }
  .pv-grid a[aria-current] { box-shadow: inset 0 0 0 1px var(--brass); }
  .pv-grid svg, .pv-strip svg { color:var(--brass); }
  .pv-strip { display:flex; gap:var(--space-2); margin-top:var(--space-8); padding:var(--space-2) 0; border-top:1px solid var(--line); overflow-x:auto; }
  .pv-strip a { display:inline-flex; align-items:center; gap:var(--space-1); min-height:44px; padding-inline:var(--space-3); border:1px solid var(--line-strong); border-radius:var(--radius-pill); color:var(--ink); font-size:14px; font-weight:500; white-space:nowrap; text-decoration:none; }
  .pv-strip a[aria-current] { background:var(--brass); border-color:var(--brass); color:var(--on-brass); }
  .pv-strip a[aria-current] svg { color:inherit; }
</style>
