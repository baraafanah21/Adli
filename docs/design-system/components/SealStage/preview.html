<!-- @dsCard group="Products" height=560 subtitle="Product card: a full-bleed photo in a 4:5 brass frame, the seal as a corner badge" -->
<style>
  /* Stand-ins for real photos: a full-bleed scene, edge to edge, as a phone photo would be. */
  .photo { position: absolute; inset: 0; }
  .photo--perfume { background: radial-gradient(circle at 50% 38%, var(--brass) 0 14%, transparent 15%), linear-gradient(160deg, var(--oud), var(--forest)); }
  .photo--watch { background: radial-gradient(circle at 50% 50%, var(--surface) 0 22%, var(--ink) 23% 26%, transparent 27%), linear-gradient(200deg, var(--line-strong), var(--surface-sunk)); }
  /* The badge is the logo file itself (public/brand/adli-seal.svg through BrandMark), never redrawn. */
  .seal { display: block; width: 32px; height: 32px; }
</style>
<div class="ad-root" style="padding:32px 24px;display:flex;flex-wrap:wrap;gap:32px">
  <article class="ad-card">
    <div class="ad-photo">
      <div class="ad-photo__frame">
        <span class="photo photo--perfume" role="img" aria-label="صورة المنتج"></span>
        <span class="ad-photo__seal"><img class="seal" src="../../../../public/brand/adli-seal.svg" alt="" width="32" height="32"></span>
      </div>
      <span class="ad-tag">كمية محدودة</span>
    </div>
    <div class="ad-card__body">
      <h3 class="ad-card__name">عود ملكي</h3>
      <p class="ad-card__meta">عطر شرقي، 100 مل</p>
      <div class="ad-card__row">
        <span class="ad-price">₪ 180</span>
        <button class="ad-btn ad-btn--primary" type="button">أضف للطلب</button>
      </div>
    </div>
  </article>
  <article class="ad-card">
    <div class="ad-photo">
      <div class="ad-photo__frame">
        <span class="photo photo--watch" role="img" aria-label="صورة المنتج"></span>
        <span class="ad-photo__seal"><img class="seal" src="../../../../public/brand/adli-seal.svg" alt="" width="32" height="32"></span>
      </div>
    </div>
    <div class="ad-card__body">
      <h3 class="ad-card__name">ساعة جلد بني</h3>
      <p class="ad-card__meta">ساعات وإكسسوارات</p>
      <div class="ad-card__row">
        <span class="ad-price">₪ 220</span>
        <button class="ad-btn ad-btn--primary" type="button">أضف للطلب</button>
      </div>
    </div>
  </article>
</div>
